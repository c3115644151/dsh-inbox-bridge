name: Bug report
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        只读问题请附上工作目录下 `.work/inbox-bridge/plugin.log` 里相关的几行；日志不含凭据。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望的结果与实际的结果。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 面板底部的「恢复配置」旁、`package.json`，或 `dsh plugin list` 里的版本。
      placeholder: 2.14.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / DSH 0.x / Node 22
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志片段
      render: text
    validations:
      required: false
