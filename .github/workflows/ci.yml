name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # macOS runners on this repository are scarce: a macOS job queued by a push
    # sat for fifteen minutes and was cancelled, turning every release red for a
    # reason that has nothing to do with the code. macOS still gets tested, just
    # once a night instead of on every push.
    - cron: "0 18 * * *"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  macos:
    name: test (macos-latest, nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test

  market:
    name: docs and market index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the documentation and the version it names
        run: npm run docs:check
      - name: Check the market index
        run: npm run market:check

  install:
    # The gate that would have caught 2.22.0-2.23.2: pack, install into an empty
    # project, import by name, run the CLI. Green tests and a green registry do
    # not prove a tarball is installable.
    name: install (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pack, install and run the package
        run: npm run verify:install