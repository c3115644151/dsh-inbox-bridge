<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img">
  <style>
    .bg { fill: #f6f7f9; }
    .card { fill: #ffffff; stroke: #d9dee6; stroke-width: 1.5; }
    .soft { fill: #e9edf2; }
    .ink { fill: none; stroke: #59636f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .bar { fill: #c9d1db; }
    .arrow { fill: none; stroke: #9aa4b2; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .accent { fill: #3b82f6; }
    .on-accent { fill: #ffffff; }
    .pending { fill: #f59e0b; }
    .delivered { fill: #3b82f6; }
    .done { fill: #22c55e; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #13161b; }
      .card { fill: #1b2027; stroke: #303844; }
      .soft { fill: #242b34; }
      .ink { stroke: #b6bfca; }
      .bar { fill: #3d4653; }
      .arrow { stroke: #5b6572; }
      .accent { fill: #60a5fa; }
      .pending { fill: #fbbf24; }
      .delivered { fill: #60a5fa; }
      .done { fill: #4ade80; }
    }
  </style>
  <rect class="bg" width="640" height="300" rx="18"/>

  <!-- external sources: CI, notifications, comments -->
  <rect class="card" x="34" y="82" width="148" height="46" rx="12"/>
  <g class="ink">
    <circle cx="62" cy="105" r="8"/>
    <circle cx="62" cy="105" r="3"/>
    <path d="M62 95.5V92M62 118v-3.5M51.5 105H48M76 105h-3.5"/>
  </g>
  <rect class="bar" x="84" y="96" width="82" height="6" rx="3"/>
  <rect class="bar" x="84" y="109" width="52" height="6" rx="3"/>

  <rect class="card" x="34" y="136" width="148" height="46" rx="12"/>
  <g class="ink">
    <path d="M62 148c-6.5 0-9.5 4.6-9.5 9.6v4.4l-3.5 4.6h26l-3.5-4.6v-4.4c0-5-3-9.6-9.5-9.6z"/>
    <circle cx="62" cy="170" r="2.5"/>
  </g>
  <rect class="bar" x="84" y="150" width="82" height="6" rx="3"/>
  <rect class="bar" x="84" y="163" width="52" height="6" rx="3"/>

  <rect class="card" x="34" y="190" width="148" height="46" rx="12"/>
  <g class="ink">
    <rect x="49" y="204" width="26" height="17" rx="5"/>
    <path d="M55 221v5l7-5"/>
  </g>
  <rect class="bar" x="84" y="204" width="82" height="6" rx="3"/>
  <rect class="bar" x="84" y="217" width="52" height="6" rx="3"/>

  <!-- flow into the inbox and out to the next turn -->
  <path class="arrow" d="M192 155H228M228 147l8 8-8 8"/>
  <path class="arrow" d="M404 155H440M440 147l8 8-8 8"/>

  <!-- local inbox: events falling in, three states below -->
  <rect class="card" x="246" y="58" width="150" height="190" rx="16"/>
  <rect class="pending" x="303" y="78" width="12" height="5" rx="2.5"/>
  <rect class="delivered" x="315" y="70" width="12" height="5" rx="2.5"/>
  <rect class="done" x="327" y="78" width="12" height="5" rx="2.5"/>
  <path class="ink" d="M292 100h14l7 12h16l7-12h14v26a8 8 0 0 1-8 8h-42a8 8 0 0 1-8-8z"/>
  <circle class="pending" cx="284" cy="163" r="5"/>
  <rect class="bar" x="296" y="159" width="76" height="8" rx="4"/>
  <circle class="delivered" cx="284" cy="187" r="5"/>
  <rect class="bar" x="296" y="183" width="76" height="8" rx="4"/>
  <circle class="done" cx="284" cy="211" r="5"/>
  <rect class="bar" x="296" y="207" width="76" height="8" rx="4"/>

  <!-- next conversation turn: a fresh message, a turn-start marker -->
  <rect class="soft" x="474" y="76" width="116" height="60" rx="14"/>
  <rect class="card" x="462" y="108" width="126" height="78" rx="14"/>
  <path class="card" d="M480 186v14l16-14z"/>
  <rect class="bar" x="478" y="124" width="88" height="7" rx="3.5"/>
  <rect class="bar" x="478" y="140" width="68" height="7" rx="3.5"/>
  <rect class="bar" x="478" y="156" width="48" height="7" rx="3.5"/>
  <circle class="accent" cx="586" cy="170" r="15"/>
  <path class="on-accent" d="M581 162l11 8-11 8z"/>
</svg>
